<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Никита. Битва за смены</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="canvas-wrapper">
      <canvas id="game" width="960" height="540"></canvas>
      <!-- Невидимая кнопка для мобильных устройств поверх канваса -->
      <button id="html-start-btn"></button>
    </div>
    
    <!-- Виртуальные кнопки для смартфона -->
    <div id="mobile-controls">
      <div class="dpad">
        <button class="btn" id="btn-left">◀</button>
        <button class="btn" id="btn-right">▶</button>
      </div>
      <div class="actions">
        <!-- Новая кнопка E для метания молота -->
        <button class="btn action-btn" id="btn-throw" style="background: rgba(255, 215, 0, 0.2); border-color: rgba(255, 215, 0, 0.8);">E</button>
        <button class="btn action-btn" id="btn-action">A</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/items.js"></script>
  <script src="js/background.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
