// ==================== УТИЛИТЫ ДЛЯ ГРАФИКИ ====================
function roundRect(ctx, x, y, w, h, r) {
  if (r > w/2) r = w/2;
  if (r > h/2) r = h/2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawGlowCircle(x, y, r, color, intensity = 1) {
  const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, color.replace(')', `, ${0.6 * intensity})`).replace('rgb', 'rgba'));
  grad.addColorStop(0.5, color.replace(')', `, ${0.2 * intensity})`).replace('rgb', 'rgba'));
  grad.addColorStop(1, color.replace(')', ', 0)').replace('rgb', 'rgba'));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
}
function withShadow(color, blur, fn) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  fn();
  ctx.restore();
}
function lerp(a, b, t) { return a + (b - a) * t; }

const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audio = new AudioCtx();
let soundEnabled = true;
function playTone(freq, dur, type='sine', vol=0.1, slideTo=null) {
  if (!soundEnabled) return;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audio.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audio.currentTime + dur);
  gain.gain.setValueAtTime(vol, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  osc.connect(gain); gain.connect(audio.destination);
  osc.start(); osc.stop(audio.currentTime + dur);
}

// ==================== ПЕРСОНАЖ (УЛУЧШЕННАЯ ГРАФИКА) ====================
function drawCharacter(p, customScale = 1, customX = null, customY = null, menuMode = false) {
  const { x, y, w, h, facing, vx, vy, onGround, walkTime, landTime, invuln, powerTimer } = p;
  if (invuln > 0 && powerTimer <= 0 && Math.floor(invuln / 4) % 2 === 0) return;
  const powered = powerTimer > 0;
  let state = 'idle';
  if (!onGround) state = vy < 0 ? 'jump' : 'fall';
  else if (Math.abs(vx) > 0.1) state = 'walk';
  let legSwing = 0, armSwing = 0, bodyBob = 0, legBend = 0, armLift = 0, squash = 1;
  if (state === 'walk') {
    legSwing = Math.sin(walkTime) * 0.45;
    armSwing = -Math.sin(walkTime) * 0.6;
    bodyBob = Math.abs(Math.sin(walkTime*2)) * 1.5;
  } else if (state === 'jump') { legBend = 0.4; armLift = -0.3; bodyBob = -2; }
  else if (state === 'fall') { legSwing = 0.2; armLift = -0.5; bodyBob = 1; }
  else { bodyBob = Math.sin(globalTime/500) * 0.8; }
  if (landTime > 0) { const k = landTime / 10; squash = 1 - Math.sin(k * Math.PI) * 0.15; }
  
  // Тень под персонажем
  if (onGround && !menuMode) {
    const shadowW = 30 + Math.abs(vx) * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h + 2, shadowW/2, 4, 0, 0, Math.PI*2);
    ctx.fill();
  }
  
  // Аура при бонусе
  if (powered) {
    const auraR = 80 + Math.sin(globalTime/100) * 12;
    const aura = ctx.createRadialGradient(x + w/2, y + h/2, 10, x + w/2, y + h/2, auraR);
    aura.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
    aura.addColorStop(0.4, 'rgba(255, 180, 0, 0.25)');
    aura.addColorStop(0.7, 'rgba(255, 120, 0, 0.1)');
    aura.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(x + w/2, y + h/2, auraR, 0, Math.PI*2); ctx.fill();
  }
  
  ctx.save();
  if (customScale !== 1) {
    ctx.translate(customX, customY);
    ctx.scale(customScale, customScale);
    ctx.translate(-(x + w/2), -(y + h));
  }
  ctx.translate(x + w/2, y + h);
  ctx.scale(facing, squash);
  ctx.translate(0, bodyBob);
  const hh = h, bodyW = w * 0.9;

  // Улучшенные цвета с градиентами
  const skinBase = powered ? '#e8b99a' : '#f0c9a8';
  const skinShadow = powered ? '#c89a7a' : '#d4a882';
  
  const drawLeg = (offsetX, angle, bend) => {
    ctx.save();
    ctx.translate(offsetX, -hh*0.45);
    ctx.rotate(angle);
    if (bend > 0) { ctx.translate(0, hh*0.2); ctx.rotate(bend); ctx.translate(0, -hh*0.2); }
    
    // Нога с градиентом (джинсы)
    const legGrad = ctx.createLinearGradient(-bodyW*0.18, 0, bodyW*0.18, 0);
    if (powered) {
      legGrad.addColorStop(0, '#2a3a1a'); legGrad.addColorStop(0.5, '#4a5c2a'); legGrad.addColorStop(1, '#2a3a1a');
    } else {
      legGrad.addColorStop(0, '#3a4a5a'); legGrad.addColorStop(0.5, '#5a6b7a'); legGrad.addColorStop(1, '#3a4a5a');
    }
    ctx.fillStyle = legGrad;
    roundRect(ctx, -bodyW*0.18, 0, bodyW*0.36, hh*0.45, 4); ctx.fill();
    
    if (powered) {
      // Галифе
      const galGrad = ctx.createLinearGradient(-bodyW*0.25, 0, bodyW*0.25, 0);
      galGrad.addColorStop(0, '#2a3a1a'); galGrad.addColorStop(0.5, '#4a5c2a'); galGrad.addColorStop(1, '#2a3a1a');
      ctx.fillStyle = galGrad;
      ctx.beginPath();
      ctx.moveTo(-bodyW*0.25, 0); ctx.lineTo(bodyW*0.25, 0);
      ctx.lineTo(bodyW*0.18, hh*0.15); ctx.lineTo(-bodyW*0.18, hh*0.15);
      ctx.closePath(); ctx.fill();
    }
    
    // Обувь с бликом
    if (powered) {
      const bootGrad = ctx.createLinearGradient(0, hh*0.4, 0, hh*0.48);
      bootGrad.addColorStop(0, '#2a2a2a'); bootGrad.addColorStop(1, '#050505');
      ctx.fillStyle = bootGrad;
      roundRect(ctx, -bodyW*0.18 - 2, hh*0.4, bodyW*0.36 + 6, 8, 3); ctx.fill();
    } else {
      const shoeGrad = ctx.createLinearGradient(0, hh*0.4, 0, hh*0.48);
      shoeGrad.addColorStop(0, '#ffffff'); shoeGrad.addColorStop(1, '#b0b0b0');
      ctx.fillStyle = shoeGrad;
      roundRect(ctx, -bodyW*0.18 - 2, hh*0.4, bodyW*0.36 + 6, 8, 3); ctx.fill();
      ctx.fillStyle = '#3a7bd5';
      roundRect(ctx, -bodyW*0.18 + 2, hh*0.42, 8, 4, 2); ctx.fill();
    }
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-bodyW*0.18 - 2, hh*0.47, bodyW*0.36 + 6, 2);
    ctx.restore();
  };
  ctx.globalAlpha = 0.85; drawLeg(-bodyW*0.2, -legSwing + legBend, legBend);
  ctx.globalAlpha = 1; drawLeg(bodyW*0.2, legSwing + legBend, legBend);

  // Торс с градиентом
  const shirtGrad = ctx.createLinearGradient(-bodyW/2, 0, bodyW/2, 0);
  if (powered) {
    shirtGrad.addColorStop(0, '#3a4a1a'); shirtGrad.addColorStop(0.5, '#6a7c3a'); shirtGrad.addColorStop(1, '#3a4a1a');
  } else {
    shirtGrad.addColorStop(0, '#6a9fbf'); shirtGrad.addColorStop(0.5, '#a8d6ea'); shirtGrad.addColorStop(1, '#6a9fbf');
  }
  ctx.fillStyle = shirtGrad;
  ctx.beginPath();
  ctx.moveTo(-bodyW/2 - 2, -hh*0.85); ctx.lineTo(-bodyW/2 - 6, -hh*0.45);
  ctx.lineTo(bodyW/2 + 6, -hh*0.45); ctx.lineTo(bodyW/2 + 2, -hh*0.85);
  ctx.closePath(); ctx.fill();
  
  // Тень на одежде
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.moveTo(-bodyW/2 + 2, -hh*0.6); ctx.lineTo(bodyW/2 - 2, -hh*0.6);
  ctx.lineTo(bodyW/2 + 4, -hh*0.45); ctx.lineTo(-bodyW/2 - 4, -hh*0.45);
  ctx.closePath(); ctx.fill();

  if (powered) {
    ctx.fillStyle = '#2a1a0a'; ctx.fillRect(-bodyW/2 - 4, -hh*0.52, bodyW + 8, 6);
    const buckleGrad = ctx.createLinearGradient(-4, 0, 4, 0);
    buckleGrad.addColorStop(0, '#ffd700'); buckleGrad.addColorStop(0.5, '#fff8b0'); buckleGrad.addColorStop(1, '#ffd700');
    ctx.fillStyle = buckleGrad; ctx.fillRect(-4, -hh*0.52, 8, 6);
    ctx.fillStyle = '#8b6914'; ctx.fillRect(-2, -hh*0.51, 4, 4);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(-bodyW/2 - 2, -hh*0.85, 10, 4);
    ctx.fillRect(bodyW/2 - 8, -hh*0.85, 10, 4);
    ctx.fillStyle = '#ffd700';
    for(let i=0; i<3; i++) { ctx.beginPath(); ctx.arc(0, -hh*0.78 + i*10, 2, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#3a4a1a';
    ctx.beginPath();
    ctx.moveTo(-8, -hh*0.85); ctx.lineTo(0, -hh*0.83); ctx.lineTo(8, -hh*0.85);
    ctx.lineTo(6, -hh*0.88); ctx.lineTo(-6, -hh*0.88); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd700'; drawStar(0, -hh*0.86, 5, 2.5);
  } else {
    ctx.fillStyle = '#4a7a9a';
    for(let i=0; i<4; i++) { ctx.beginPath(); ctx.arc(0, -hh*0.75 + i*10, 1.5, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#80b8d4';
    ctx.beginPath();
    ctx.moveTo(-6, -hh*0.85); ctx.lineTo(0, -hh*0.82); ctx.lineTo(6, -hh*0.85);
    ctx.lineTo(3, -hh*0.88); ctx.lineTo(-3, -hh*0.88); ctx.closePath(); ctx.fill();
  }

  const drawArm = (offsetX, angle, lift) => {
    ctx.save();
    ctx.translate(offsetX, -hh*0.82);
    ctx.rotate(angle + lift);
    const armGrad = ctx.createLinearGradient(-4, 0, 4, 0);
    if (powered) {
      armGrad.addColorStop(0, '#3a4a1a'); armGrad.addColorStop(0.5, '#6a7c3a'); armGrad.addColorStop(1, '#3a4a1a');
    } else {
      armGrad.addColorStop(0, '#6a9fbf'); armGrad.addColorStop(0.5, '#a8d6ea'); armGrad.addColorStop(1, '#6a9fbf');
    }
    ctx.fillStyle = armGrad;
    roundRect(ctx, -4, 0, 8, hh*0.35, 4); ctx.fill();
    if (powered) { ctx.fillStyle = '#c0392b'; ctx.fillRect(-4, 0, 8, 3); }
    // Кисть с градиентом
    const handGrad = ctx.createRadialGradient(0, hh*0.38, 0, 0, hh*0.38, 5);
    handGrad.addColorStop(0, skinBase); handGrad.addColorStop(1, skinShadow);
    ctx.fillStyle = handGrad;
    ctx.beginPath(); ctx.arc(0, hh*0.38, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  };
  ctx.globalAlpha = 0.85; drawArm(-bodyW/2 - 2, armSwing, armLift);
  ctx.globalAlpha = 1; drawArm(bodyW/2 + 2, -armSwing, armLift);

  // Шея и голова с градиентом
  const neckGrad = ctx.createLinearGradient(-5, 0, 5, 0);
  neckGrad.addColorStop(0, skinShadow); neckGrad.addColorStop(0.5, skinBase); neckGrad.addColorStop(1, skinShadow);
  ctx.fillStyle = neckGrad;
  ctx.fillRect(-5, -hh*0.88, 10, 8);
  
  const faceGrad = ctx.createRadialGradient(-3, -hh*0.98, 0, 0, -hh*0.95, 15);
  faceGrad.addColorStop(0, skinBase); faceGrad.addColorStop(1, skinShadow);
  ctx.fillStyle = faceGrad;
  ctx.beginPath(); ctx.ellipse(0, -hh*0.95, 10, 12, 0, 0, Math.PI*2); ctx.fill();
  
  if (powered) {
    // Пилотка с градиентом
    const capGrad = ctx.createLinearGradient(-12, -hh*1.02, 12, -hh*0.92);
    capGrad.addColorStop(0, '#2a3a1a'); capGrad.addColorStop(0.5, '#6a7c3a'); capGrad.addColorStop(1, '#2a3a1a');
    ctx.fillStyle = capGrad;
    ctx.beginPath();
    ctx.moveTo(-12, -hh*1.02); ctx.lineTo(12, -hh*1.02);
    ctx.lineTo(10, -hh*0.92); ctx.lineTo(-10, -hh*0.92);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1a2a0a';
    ctx.beginPath();
    ctx.moveTo(-10, -hh*0.92); ctx.lineTo(10, -hh*0.92);
    ctx.lineTo(12, -hh*0.89); ctx.lineTo(-12, -hh*0.89);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c0392b'; drawStar(0, -hh*0.97, 4, 2);
  } else {
    // Волосы с объёмом
    const hairGrad = ctx.createLinearGradient(0, -hh*1.1, 0, -hh*0.95);
    hairGrad.addColorStop(0, '#1a0e08'); hairGrad.addColorStop(0.5, '#3d2a1c'); hairGrad.addColorStop(1, '#2d1e14');
    ctx.fillStyle = hairGrad;
    ctx.beginPath(); ctx.ellipse(0, -hh*1.02, 11, 9, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-10, -hh*0.98); ctx.quadraticCurveTo(-2, -hh*0.92, 8, -hh*0.96);
    ctx.lineTo(10, -hh*0.98); ctx.quadraticCurveTo(0, -hh*1.05, -10, -hh*0.98); ctx.fill();
    // Блик на волосах
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.ellipse(-4, -hh*1.04, 5, 2.5, -0.3, 0, Math.PI*2); ctx.fill();
  }
  
  // Борода с градиентом
  const beardGrad = ctx.createLinearGradient(0, -hh*0.95, 0, -hh*0.83);
  beardGrad.addColorStop(0, '#3d2a1c'); beardGrad.addColorStop(1, '#1a0e08');
  ctx.fillStyle = beardGrad;
  ctx.beginPath();
  if (powered) {
    ctx.moveTo(-7, -hh*0.9); ctx.quadraticCurveTo(0, -hh*0.88, 7, -hh*0.9);
    ctx.quadraticCurveTo(0, -hh*0.86, -7, -hh*0.9);
  } else {
    ctx.moveTo(-9, -hh*0.92); ctx.quadraticCurveTo(0, -hh*0.83, 9, -hh*0.92);
    ctx.lineTo(8, -hh*0.95); ctx.quadraticCurveTo(0, -hh*0.88, -8, -hh*0.95);
  }
  ctx.closePath(); ctx.fill();

  // Глаза с бликами
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-4, -hh*0.96, 2.5, 1.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4, -hh*0.96, 2.5, 1.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.arc(-3.5, -hh*0.96, 1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.5, -hh*0.96, 1, 0, Math.PI*2); ctx.fill();
  // Блик в зрачке
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-3.2, -hh*0.97, 0.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.8, -hh*0.97, 0.4, 0, Math.PI*2); ctx.fill();
  
  ctx.strokeStyle = '#2d1e14'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-7, -hh*0.99); ctx.lineTo(-2, -hh*0.98); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, -hh*0.99); ctx.lineTo(2, -hh*0.98); ctx.stroke();
  ctx.restore();
}

function drawStar(cx, cy, outer, inner) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI/2 + i * Math.PI * 2/5;
    const a2 = a + Math.PI/5;
    ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
    ctx.lineTo(cx + Math.cos(a2) * inner, cy + Math.sin(a2) * inner);
  }
  ctx.closePath(); ctx.fill();
}

// ==================== ОСЬМИНОГ С BLOOM ====================
function drawOctopus(o, time) {
  if (o.taken) return;
  const pulse = Math.sin(time * 0.005 + o.phase) * 0.15 + 1;
  const r = o.r * pulse;
  ctx.save();
  ctx.translate(o.x, o.y);
  
  // Многослойное свечение (bloom-имитация)
  const glow1 = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 4.5);
  glow1.addColorStop(0, 'rgba(200, 100, 255, 0.5)');
  glow1.addColorStop(0.3, 'rgba(160, 60, 230, 0.25)');
  glow1.addColorStop(0.7, 'rgba(100, 20, 180, 0.08)');
  glow1.addColorStop(1, 'rgba(60, 0, 120, 0)');
  ctx.fillStyle = glow1;
  ctx.beginPath(); ctx.arc(0, 0, r * 4.5, 0, Math.PI*2); ctx.fill();
  
  const glow2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.2);
  glow2.addColorStop(0, 'rgba(220, 140, 255, 0.6)');
  glow2.addColorStop(1, 'rgba(150, 50, 230, 0)');
  ctx.fillStyle = glow2;
  ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, Math.PI*2); ctx.fill();
  
  // Щупальца с градиентом
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2 + Math.PI/2;
    const wave = Math.sin(time * 0.01 + o.tentaclePhase + i * 0.8) * 0.5;
    const tx = Math.cos(angle + wave * 0.3) * r * 1.8;
    const ty = Math.sin(angle + wave * 0.3) * r * 1.8 + r * 0.3;
    const tentGrad = ctx.createLinearGradient(0, 0, tx, ty);
    tentGrad.addColorStop(0, '#d67bff');
    tentGrad.addColorStop(1, '#8a30c0');
    ctx.strokeStyle = tentGrad;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * r * 0.6, Math.sin(angle) * r * 0.6);
    ctx.quadraticCurveTo(Math.cos(angle) * r * 1.2 + Math.sin(wave) * 3, Math.sin(angle) * r * 1.2, tx, ty);
    ctx.stroke();
    ctx.fillStyle = '#f0c0ff';
    ctx.beginPath(); ctx.arc(tx, ty, 1.8, 0, Math.PI*2); ctx.fill();
    // Свечение на кончике
    ctx.fillStyle = 'rgba(255, 200, 255, 0.6)';
    ctx.beginPath(); ctx.arc(tx, ty, 3, 0, Math.PI*2); ctx.fill();
  }
  
  // Тело с многослойным градиентом
  const bodyGrad = ctx.createRadialGradient(-r*0.35, -r*0.4, 0, 0, 0, r * 1.3);
  bodyGrad.addColorStop(0, '#e88bff');
  bodyGrad.addColorStop(0.4, '#b040e0');
  bodyGrad.addColorStop(0.8, '#6a1090');
  bodyGrad.addColorStop(1, '#3a0050');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.ellipse(0, -r*0.2, r * 0.9, r * 1.1, 0, 0, Math.PI*2); ctx.fill();
  
  // Блик
  const highlight = ctx.createRadialGradient(-r*0.4, -r*0.6, 0, -r*0.4, -r*0.6, r*0.5);
  highlight.addColorStop(0, 'rgba(255, 230, 255, 0.8)');
  highlight.addColorStop(1, 'rgba(255, 230, 255, 0)');
  ctx.fillStyle = highlight;
  ctx.beginPath(); ctx.ellipse(-r*0.4, -r*0.6, r*0.35, r*0.45, -0.3, 0, Math.PI*2); ctx.fill();
  
  // Глаза
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r*0.35, -r*0.15, r*0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.35, -r*0.15, r*0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a0030';
  ctx.beginPath(); ctx.arc(-r*0.35, -r*0.1, r*0.16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.35, -r*0.1, r*0.16, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r*0.3, -r*0.15, r*0.07, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.4, -r*0.15, r*0.07, 0, Math.PI*2); ctx.fill();
  
  ctx.restore();
}

// ==================== БОНУС СЕРП И МОЛОТ ====================
function drawGoldenPower(gp, time) {
  if (!gp || gp.taken) return;
  const pulse = Math.sin(time * 0.004 + gp.phase) * 0.15 + 1;
  const r = gp.r * pulse;
  ctx.save();
  ctx.translate(gp.x, gp.y);
  
  // Многослойное золотое свечение
  const glow1 = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 5);
  glow1.addColorStop(0, 'rgba(255, 220, 50, 0.6)');
  glow1.addColorStop(0.3, 'rgba(255, 180, 0, 0.3)');
  glow1.addColorStop(0.6, 'rgba(255, 120, 0, 0.1)');
  glow1.addColorStop(1, 'rgba(200, 80, 0, 0)');
  ctx.fillStyle = glow1;
  ctx.beginPath(); ctx.arc(0, 0, r * 5, 0, Math.PI*2); ctx.fill();
  
  const wobble = Math.sin(time * 0.003 + gp.phase) * 0.15;
  ctx.rotate(wobble);
  
  // Молот
  ctx.save();
  ctx.translate(r * 0.3, 0); ctx.rotate(0.2);
  const handleGrad = ctx.createLinearGradient(-2, 0, 2, 0);
  handleGrad.addColorStop(0, '#5a2a0a'); handleGrad.addColorStop(0.5, '#a06030'); handleGrad.addColorStop(1, '#5a2a0a');
  ctx.fillStyle = handleGrad;
  ctx.fillRect(-2, -r * 0.5, 4, r * 1.1);
  const headGrad = ctx.createLinearGradient(-r*0.4, -r*0.5, r*0.4, -r*0.1);
  headGrad.addColorStop(0, '#fff8b0'); headGrad.addColorStop(0.5, '#ffd700'); headGrad.addColorStop(1, '#b8860b');
  ctx.fillStyle = headGrad;
  roundRect(ctx, -r * 0.4, -r * 0.5, r * 0.8, r * 0.4, 3); ctx.fill();
  ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.fillRect(-r * 0.3, -r * 0.45, r * 0.5, 3);
  ctx.restore();
  
  // Серп
  ctx.save();
  ctx.translate(-r * 0.35, 0); ctx.rotate(-0.2);
  ctx.fillStyle = handleGrad;
  ctx.fillRect(-2, -r * 0.2, 4, r * 0.9);
  const bladeGrad = ctx.createLinearGradient(0, -r*0.7, r*0.5, 0);
  bladeGrad.addColorStop(0, '#fff8b0'); bladeGrad.addColorStop(0.5, '#ffd700'); bladeGrad.addColorStop(1, '#b8860b');
  ctx.fillStyle = bladeGrad;
  ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.2); ctx.quadraticCurveTo(r * 0.7, -r * 0.7, r * 0.3, -r * 0.1);
  ctx.quadraticCurveTo(r * 0.5, -r * 0.4, 0, -r * 0.05);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(r * 0.1, -r * 0.3);
  ctx.quadraticCurveTo(r * 0.4, -r * 0.5, r * 0.25, -r * 0.2); ctx.stroke();
  ctx.restore();
  
  // Искры
  for (let i = 0; i < 6; i++) {
    const ang = time * 0.002 + i * Math.PI/3;
    const dist = r * 1.8 + Math.sin(time * 0.005 + i) * 5;
    ctx.fillStyle = `rgba(255, 240, 150, ${0.5 + Math.sin(time*0.008 + i)*0.5})`;
    ctx.beginPath(); ctx.arc(Math.cos(ang) * dist, Math.sin(ang) * dist, 2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ==================== МОЛОТ В ПОЛЁТЕ ====================
function drawFlyingHammer(h, time) {
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(h.rotation);
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 35);
  glow.addColorStop(0, 'rgba(255, 220, 50, 0.7)');
  glow.addColorStop(0.5, 'rgba(255, 180, 0, 0.3)');
  glow.addColorStop(1, 'rgba(200, 120, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 35, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#6a3a1a';
  ctx.fillRect(-2, -2, 4, 22);
  const headGrad = ctx.createLinearGradient(-10, -12, 10, 2);
  headGrad.addColorStop(0, '#fff8b0'); headGrad.addColorStop(0.5, '#ffd700'); headGrad.addColorStop(1, '#b8860b');
  ctx.fillStyle = headGrad;
  roundRect(ctx, -10, -12, 20, 14, 3); ctx.fill();
  ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.fillRect(-7, -10, 12, 3);
  ctx.restore();
  for (let i = 1; i <= 4; i++) {
    ctx.fillStyle = `rgba(255, 215, 0, ${0.6 - i*0.15})`;
    ctx.beginPath(); ctx.arc(h.x - h.vx*i*2, h.y - h.vy*i*2, 5 - i, 0, Math.PI*2); ctx.fill();
  }
}

// ==================== ВРАГ-ДЕВУШКА (улучшенная) ====================
function drawEnemyGirl(e) {
  if (!e.alive) return;
  const { x, y, w, h, facing, walkTime, color, hair } = e;
  ctx.save();
  ctx.translate(x + w/2, y + h);
  
  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 2, 14, 3, 0, 0, Math.PI*2); ctx.fill();
  
  ctx.scale(facing, 1);
  const legSwing = Math.sin(walkTime) * 0.4;
  const armSwing = -Math.sin(walkTime) * 0.5;
  const bob = Math.abs(Math.sin(walkTime*2)) * 1.2;
  ctx.translate(0, bob);
  const hh = h, bodyW = w * 0.9;

  const drawLeg = (offsetX, angle) => {
    ctx.save();
    ctx.translate(offsetX, -hh*0.45);
    ctx.rotate(angle);
    const skinGrad = ctx.createLinearGradient(-bodyW*0.15, 0, bodyW*0.15, 0);
    skinGrad.addColorStop(0, '#d4a882'); skinGrad.addColorStop(0.5, '#f0c9a8'); skinGrad.addColorStop(1, '#d4a882');
    ctx.fillStyle = skinGrad;
    roundRect(ctx, -bodyW*0.15, 0, bodyW*0.3, hh*0.4, 3); ctx.fill();
    const shoeGrad = ctx.createLinearGradient(0, hh*0.35, 0, hh*0.43);
    shoeGrad.addColorStop(0, '#e74c3c'); shoeGrad.addColorStop(1, '#8b0000');
    ctx.fillStyle = shoeGrad;
    roundRect(ctx, -bodyW*0.15 - 2, hh*0.35, bodyW*0.3 + 4, 8, 2); ctx.fill();
    ctx.fillStyle = '#5a0000';
    ctx.fillRect(-bodyW*0.15 - 2, hh*0.4, 4, 4);
    ctx.restore();
  };
  ctx.globalAlpha = 0.85; drawLeg(-bodyW*0.18, -legSwing);
  ctx.globalAlpha = 1; drawLeg(bodyW*0.18, legSwing);

  // Юбка с градиентом
  const skirtGrad = ctx.createLinearGradient(-bodyW*0.4, -hh*0.5, bodyW*0.4, -hh*0.38);
  skirtGrad.addColorStop(0, '#0a0a0a'); skirtGrad.addColorStop(0.5, '#2a2a2a'); skirtGrad.addColorStop(1, '#0a0a0a');
  ctx.fillStyle = skirtGrad;
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.35, -hh*0.5); ctx.lineTo(bodyW*0.35, -hh*0.5);
  ctx.lineTo(bodyW*0.45, -hh*0.38); ctx.lineTo(-bodyW*0.45, -hh*0.38);
  ctx.closePath(); ctx.fill();

  // Торс
  const skinGrad = ctx.createLinearGradient(-bodyW*0.35, -hh*0.75, bodyW*0.35, -hh*0.5);
  skinGrad.addColorStop(0, '#d4a882'); skinGrad.addColorStop(0.5, '#f0c9a8'); skinGrad.addColorStop(1, '#d4a882');
  ctx.fillStyle = skinGrad;
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.35, -hh*0.75); ctx.lineTo(bodyW*0.35, -hh*0.75);
  ctx.lineTo(bodyW*0.32, -hh*0.5); ctx.lineTo(-bodyW*0.32, -hh*0.5);
  ctx.closePath(); ctx.fill();

  // Топик
  const topGrad = ctx.createLinearGradient(-bodyW*0.35, -hh*0.75, bodyW*0.35, -hh*0.62);
  topGrad.addColorStop(0, color); topGrad.addColorStop(0.5, '#fff'); topGrad.addColorStop(1, color);
  ctx.fillStyle = topGrad;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.35, -hh*0.75); ctx.lineTo(bodyW*0.35, -hh*0.75);
  ctx.lineTo(bodyW*0.38, -hh*0.62); ctx.lineTo(-bodyW*0.38, -hh*0.62);
  ctx.closePath(); ctx.fill();
  // Блик на топе
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.25, -hh*0.73); ctx.lineTo(bodyW*0.05, -hh*0.73);
  ctx.lineTo(bodyW*0.05, -hh*0.68); ctx.lineTo(-bodyW*0.3, -hh*0.68);
  ctx.closePath(); ctx.fill();
  
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-bodyW*0.3, -hh*0.75); ctx.lineTo(-bodyW*0.15, -hh*0.82); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bodyW*0.3, -hh*0.75); ctx.lineTo(bodyW*0.15, -hh*0.82); ctx.stroke();

  const drawArm = (offsetX, angle) => {
    ctx.save();
    ctx.translate(offsetX, -hh*0.75);
    ctx.rotate(angle);
    const armGrad = ctx.createLinearGradient(-3, 0, 3, 0);
    armGrad.addColorStop(0, '#d4a882'); armGrad.addColorStop(0.5, '#f0c9a8'); armGrad.addColorStop(1, '#d4a882');
    ctx.fillStyle = armGrad;
    roundRect(ctx, -3, 0, 6, hh*0.3, 3); ctx.fill();
    ctx.restore();
  };
  ctx.globalAlpha = 0.85; drawArm(-bodyW*0.35, armSwing);
  ctx.globalAlpha = 1; drawArm(bodyW*0.35, -armSwing);

  // Голова
  ctx.fillStyle = skinGrad;
  ctx.fillRect(-4, -hh*0.85, 8, 6);
  const faceGrad = ctx.createRadialGradient(-3, -hh*0.95, 0, 0, -hh*0.92, 13);
  faceGrad.addColorStop(0, '#f0c9a8'); faceGrad.addColorStop(1, '#d4a882');
  ctx.fillStyle = faceGrad;
  ctx.beginPath(); ctx.ellipse(0, -hh*0.92, 9, 11, 0, 0, Math.PI*2); ctx.fill();
  
  // Волосы
  const hairGrad = ctx.createLinearGradient(0, -hh*1.1, 0, -hh*0.7);
  hairGrad.addColorStop(0, hair); hairGrad.addColorStop(1, shadeColor(hair, -30));
  ctx.fillStyle = hairGrad;
  ctx.beginPath(); ctx.ellipse(0, -hh*1.0, 11, 10, 0, Math.PI, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-11, -hh*0.98); ctx.quadraticCurveTo(-16, -hh*0.8, -10, -hh*0.7);
  ctx.lineTo(-8, -hh*0.95); ctx.fill();
  ctx.beginPath(); ctx.moveTo(11, -hh*0.98); ctx.quadraticCurveTo(16, -hh*0.8, 10, -hh*0.7);
  ctx.lineTo(8, -hh*0.95); ctx.fill();
  
  // Блик на волосах
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(-4, -hh*1.04, 4, 2, -0.3, 0, Math.PI*2); ctx.fill();
  
  // Глаза
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-3.5, -hh*0.93, 2.5, 2, 0, 0, Math.PI*2); ctx.fill();
