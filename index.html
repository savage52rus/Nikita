  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.arc(-3, -hh*0.93, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -hh*0.93, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-2.7, -hh*0.935, 0.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.3, -hh*0.935, 0.4, 0, Math.PI*2); ctx.fill();
  
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-6, -hh*0.94); ctx.lineTo(-5, -hh*0.96); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, -hh*0.94); ctx.lineTo(5, -hh*0.96); ctx.stroke();
  ctx.strokeStyle = '#8b2e3a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, -hh*0.89, 3, 0.2, Math.PI-0.2); ctx.stroke();
  ctx.restore();
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#',''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
}

// ==================== БОСС ====================
function drawBoss(b, time) {
  if (!b || b.hp <= 0) return;
  const { x, y, w, h, facing, walkTime, hitFlash, state } = b;
  ctx.save();
  ctx.translate(x + w/2, y + h);
  
  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, 3, 22, 5, 0, 0, Math.PI*2); ctx.fill();
  
  if (b.phase === 2) {
    const auraR = 100 + Math.sin(time/100) * 15;
    const aura = ctx.createRadialGradient(0, -h/2, 10, 0, -h/2, auraR);
    aura.addColorStop(0, 'rgba(255, 50, 50, 0.4)');
    aura.addColorStop(0.5, 'rgba(255, 20, 20, 0.15)');
    aura.addColorStop(1, 'rgba(200, 0, 0, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(0, -h/2, auraR, 0, Math.PI*2); ctx.fill();
  }
  ctx.scale(facing, 1);
  if (hitFlash > 0) ctx.globalAlpha = 0.5 + Math.sin(hitFlash * 0.5) * 0.5;
  const legSwing = Math.sin(walkTime) * 0.4;
  const armSwing = -Math.sin(walkTime) * 0.5;
  const bob = Math.abs(Math.sin(walkTime*2)) * 1.5;
  ctx.translate(0, bob);
  const hh = h, bodyW = w * 0.9;
  const skinBase = hitFlash > 0 ? '#ff8888' : '#f0c9a8';
  const skinShadow = hitFlash > 0 ? '#ff6666' : '#d4a882';
  const topColor = hitFlash > 0 ? '#ff8888' : '#e74c3c';
  const hairColor = '#ff8c00';
  
  const drawLeg = (offsetX, angle) => {
    ctx.save();
    ctx.translate(offsetX, -hh*0.45);
    ctx.rotate(angle);
    const legGrad = ctx.createLinearGradient(-bodyW*0.15, 0, bodyW*0.15, 0);
    legGrad.addColorStop(0, skinShadow); legGrad.addColorStop(0.5, skinBase); legGrad.addColorStop(1, skinShadow);
    ctx.fillStyle = legGrad;
    roundRect(ctx, -bodyW*0.15, 0, bodyW*0.3, hh*0.35, 3); ctx.fill();
    // Сапог
    const bootGrad = ctx.createLinearGradient(0, hh*0.2, 0, hh*0.48);
    bootGrad.addColorStop(0, '#2a2a2a'); bootGrad.addColorStop(1, '#000');
    ctx.fillStyle = bootGrad;
    roundRect(ctx, -bodyW*0.16, hh*0.2, bodyW*0.32, hh*0.28, 3); ctx.fill();
    ctx.fillRect(-bodyW*0.16, hh*0.46, 4, 5);
    // Блик на сапоге
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(-bodyW*0.14, hh*0.22, 2, hh*0.2);
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(-3, hh*0.25, 6, 3);
    ctx.restore();
  };
  ctx.globalAlpha *= 0.85; drawLeg(-bodyW*0.18, -legSwing);
  ctx.globalAlpha /= 0.85; drawLeg(bodyW*0.18, legSwing);
  
  // Юбка с бликом
  const skirtGrad = ctx.createLinearGradient(-bodyW*0.48, -hh*0.5, bodyW*0.48, -hh*0.36);
  skirtGrad.addColorStop(0, '#000'); skirtGrad.addColorStop(0.4, '#2a2a2a'); skirtGrad.addColorStop(1, '#000');
  ctx.fillStyle = skirtGrad;
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.35, -hh*0.5); ctx.lineTo(bodyW*0.35, -hh*0.5);
  ctx.lineTo(bodyW*0.48, -hh*0.36); ctx.lineTo(-bodyW*0.48, -hh*0.36);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.3, -hh*0.48); ctx.lineTo(bodyW*0.1, -hh*0.48);
  ctx.lineTo(bodyW*0.15, -hh*0.42); ctx.lineTo(-bodyW*0.35, -hh*0.42);
  ctx.closePath(); ctx.fill();
  
  // Торс
  const torsoGrad = ctx.createLinearGradient(-bodyW*0.35, -hh*0.75, bodyW*0.35, -hh*0.5);
  torsoGrad.addColorStop(0, skinShadow); torsoGrad.addColorStop(0.5, skinBase); torsoGrad.addColorStop(1, skinShadow);
  ctx.fillStyle = torsoGrad;
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.35, -hh*0.75); ctx.lineTo(bodyW*0.35, -hh*0.75);
  ctx.lineTo(bodyW*0.32, -hh*0.5); ctx.lineTo(-bodyW*0.32, -hh*0.5);
  ctx.closePath(); ctx.fill();
  
  // Топ
  const topGrad = ctx.createLinearGradient(-bodyW*0.35, -hh*0.75, bodyW*0.35, -hh*0.62);
  topGrad.addColorStop(0, '#8b0000'); topGrad.addColorStop(0.5, topColor); topGrad.addColorStop(1, '#8b0000');
  ctx.fillStyle = topGrad;
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.35, -hh*0.75); ctx.lineTo(bodyW*0.35, -hh*0.75);
  ctx.lineTo(bodyW*0.38, -hh*0.62); ctx.lineTo(-bodyW*0.38, -hh*0.62);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = skinBase;
  ctx.beginPath();
  ctx.moveTo(-6, -hh*0.75); ctx.lineTo(0, -hh*0.70); ctx.lineTo(6, -hh*0.75);
  ctx.closePath(); ctx.fill();
  
  const drawArm = (offsetX, angle) => {
    ctx.save();
    ctx.translate(offsetX, -hh*0.75);
    ctx.rotate(angle);
    const armGrad = ctx.createLinearGradient(-3.5, 0, 3.5, 0);
    armGrad.addColorStop(0, skinShadow); armGrad.addColorStop(0.5, skinBase); armGrad.addColorStop(1, skinShadow);
    ctx.fillStyle = armGrad;
    roundRect(ctx, -3.5, 0, 7, hh*0.3, 3); ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(-4, hh*0.22, 8, 3);
    ctx.restore();
  };
  ctx.globalAlpha *= 0.85; drawArm(-bodyW*0.35, armSwing);
  ctx.globalAlpha /= 0.85; drawArm(bodyW*0.35, -armSwing);
  
  // Голова
  ctx.fillStyle = skinGrad;
  ctx.fillRect(-5, -hh*0.85, 10, 6);
  const faceGrad = ctx.createRadialGradient(-3, -hh*0.95, 0, 0, -hh*0.92, 15);
  faceGrad.addColorStop(0, skinBase); faceGrad.addColorStop(1, skinShadow);
  ctx.fillStyle = faceGrad;
  ctx.beginPath(); ctx.ellipse(0, -hh*0.92, 10, 12, 0, 0, Math.PI*2); ctx.fill();
  
  // Волосы с объёмом
  const hairGrad = ctx.createLinearGradient(0, -hh*1.12, 0, -hh*0.65);
  hairGrad.addColorStop(0, '#ffb04a'); hairGrad.addColorStop(0.5, hairColor); hairGrad.addColorStop(1, '#c05000');
  ctx.fillStyle = hairGrad;
  ctx.beginPath(); ctx.ellipse(0, -hh*1.0, 12, 11, 0, Math.PI, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-12, -hh*0.98); ctx.quadraticCurveTo(-18, -hh*0.8, -11, -hh*0.65);
  ctx.lineTo(-8, -hh*0.95); ctx.fill();
  ctx.beginPath(); ctx.moveTo(12, -hh*0.98); ctx.quadraticCurveTo(18, -hh*0.8, 11, -hh*0.65);
  ctx.lineTo(8, -hh*0.95); ctx.fill();
  // Блик
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.ellipse(-5, -hh*1.05, 5, 2.5, -0.3, 0, Math.PI*2); ctx.fill();
  
  // Корона
  const crownGrad = ctx.createLinearGradient(-10, -hh*1.14, 10, -hh*1.02);
  crownGrad.addColorStop(0, '#fff8b0'); crownGrad.addColorStop(0.5, '#ffd700'); crownGrad.addColorStop(1, '#b8860b');
  ctx.fillStyle = crownGrad;
  ctx.beginPath();
  ctx.moveTo(-10, -hh*1.05); ctx.lineTo(-8, -hh*1.12); ctx.lineTo(-4, -hh*1.07);
  ctx.lineTo(0, -hh*1.14); ctx.lineTo(4, -hh*1.07); ctx.lineTo(8, -hh*1.12);
  ctx.lineTo(10, -hh*1.05); ctx.lineTo(8, -hh*1.02); ctx.lineTo(-8, -hh*1.02);
  ctx.closePath(); ctx.fill();
  // Камни с бликами
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.arc(0, -hh*1.08, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(-0.5, -hh*1.085, 0.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3498db';
  ctx.beginPath(); ctx.arc(-5, -hh*1.06, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -hh*1.06, 1.2, 0, Math.PI*2); ctx.fill();
  
  // Глаза
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-4, -hh*0.93, 3.2, 2.3, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4, -hh*0.93, 3.2, 2.3, 0, 0, Math.PI*2); ctx.fill();
  const eyeColor = b.phase === 2 ? '#ff0000' : '#1a1a2e';
  ctx.fillStyle = eyeColor;
  ctx.beginPath(); ctx.arc(-3.5, -hh*0.93, 1.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.5, -hh*0.93, 1.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-3.2, -hh*0.935, 0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.8, -hh*0.935, 0.5, 0, Math.PI*2); ctx.fill();
  
  // Ресницы
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-7, -hh*0.94); ctx.lineTo(-6, -hh*0.97); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, -hh*0.94); ctx.lineTo(6, -hh*0.97); ctx.stroke();
  
  // Улыбка и помада
  ctx.strokeStyle = '#8b2e3a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -hh*0.87, 4, Math.PI + 0.3, -0.3); ctx.stroke();
  const lipGrad = ctx.createLinearGradient(0, -hh*0.88, 0, -hh*0.86);
  lipGrad.addColorStop(0, '#e74c3c'); lipGrad.addColorStop(1, '#8b0000');
  ctx.fillStyle = lipGrad;
  ctx.beginPath(); ctx.ellipse(0, -hh*0.87, 3.5, 1.2, 0, 0, Math.PI*2); ctx.fill();
  
  ctx.restore();
}

// ==================== ФОН С ГЛУБИНОЙ ====================
function drawBackground() {
  const time = globalTime;
  
  if (currentLevel >= 3) {
    // Складской фон с атмосферой
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    if (currentLevel === 4) {
      grad.addColorStop(0, '#0a0a15'); grad.addColorStop(0.5, '#151520'); grad.addColorStop(1, '#0a0a15');
    } else {
      grad.addColorStop(0, '#1a1a22'); grad.addColorStop(0.5, '#2a2a35'); grad.addColorStop(1, '#151520');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Дымка в глубине
    const fogGrad = ctx.createLinearGradient(0, H*0.3, 0, H);
    fogGrad.addColorStop(0, 'rgba(40, 40, 60, 0)');
    fogGrad.addColorStop(1, 'rgba(40, 40, 60, 0.4)');
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, 0, W, H);

    // Стены с параллаксом
    const bgOff = camera.x * 0.2;
    for (let i = 0; i < 20; i++) {
      const bx = (i * 220 - bgOff % 220) - 100;
      const wallGrad = ctx.createLinearGradient(bx, 0, bx + 180, 0);
      wallGrad.addColorStop(0, '#1e1e26'); wallGrad.addColorStop(0.5, '#2a2a35'); wallGrad.addColorStop(1, '#1e1e26');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(bx, 0, 180, H - 80);
      // Балки
      ctx.fillStyle = '#151520';
      ctx.fillRect(bx, 0, 8, H - 80);
      ctx.fillRect(bx + 172, 0, 8, H - 80);
      ctx.fillRect(bx, 40, 180, 10);
      // Блик на балках
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(bx + 2, 0, 2, H - 80);
    }

    // Трубы
    const pipeOff = camera.x * 0.4;
    for (let i = 0; i < 15; i++) {
      const px = (i * 180 - pipeOff % 180) - 50;
      const pipeGrad = ctx.createLinearGradient(px, 0, px + 12, 0);
      pipeGrad.addColorStop(0, '#2a2a35'); pipeGrad.addColorStop(0.5, '#4a4a55'); pipeGrad.addColorStop(1, '#2a2a35');
      ctx.fillStyle = pipeGrad;
      ctx.fillRect(px, 80, 12, 300);
      ctx.fillRect(px, 80, 60, 12);
      ctx.fillStyle = '#5a5a65';
      ctx.fillRect(px - 2, 78, 16, 16);
      ctx.fillRect(px - 2, 78 + 300, 16, 16);
    }

    // Лампы
    const lampOff = camera.x * 0.5;
    for (let i = 0; i < 20; i++) {
      const lx = (i * 160 - lampOff % 160) - 50;
      const flicker = Math.sin(time / 200 + i) > 0.3 ? 1 : 0.5;
      const isRed = currentLevel === 4;
      const lampGrad = ctx.createRadialGradient(lx, 60, 0, lx, 60, 60);
      lampGrad.addColorStop(0, isRed ? `rgba(255, 100, 100, ${0.4 * flicker})` : `rgba(255, 220, 100, ${0.4 * flicker})`);
      lampGrad.addColorStop(0.4, isRed ? `rgba(255, 50, 50, ${0.15 * flicker})` : `rgba(255, 180, 50, ${0.15 * flicker})`);
      lampGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = lampGrad;
      ctx.beginPath(); ctx.arc(lx, 60, 60, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = isRed ? `rgba(255, 200, 200, ${0.9 * flicker})` : `rgba(255, 240, 200, ${0.9 * flicker})`;
      ctx.beginPath(); ctx.arc(lx, 60, 6, 0, Math.PI*2); ctx.fill();
      // Блик
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(lx - 2, 58, 2, 0, Math.PI*2); ctx.fill();
    }

    // Пыль с движением
    for (let i = 0; i < 40; i++) {
      const dx = (i * 73 + time * 0.02) % W;
      const dy = (i * 47 + Math.sin(time * 0.001 + i) * 40) % H;
      ctx.fillStyle = `rgba(200, 200, 180, ${0.08 + Math.sin(time*0.002 + i)*0.05})`;
      ctx.beginPath(); ctx.arc(dx, dy, 1.5, 0, Math.PI*2); ctx.fill();
    }
    return;
  }

  // Небо с градиентом
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#5b9bd5');
  grad.addColorStop(0.3, '#87CEEB');
  grad.addColorStop(0.7, '#b0e0e6');
  grad.addColorStop(1, '#e0f0f5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Солнце с мягким свечением
  const sunX = W * 0.8, sunY = 100;
  const sunGlow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 200);
  sunGlow.addColorStop(0, 'rgba(255, 250, 200, 0.8)');
  sunGlow.addColorStop(0.3, 'rgba(255, 240, 150, 0.3)');
  sunGlow.addColorStop(1, 'rgba(255, 240, 150, 0)');
  ctx.fillStyle = sunGlow;
  ctx.beginPath(); ctx.arc(sunX, sunY, 200, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fffbe0';
  ctx.beginPath(); ctx.arc(sunX, sunY, 35, 0, Math.PI*2); ctx.fill();
  
  // Облака
  for (let i = 0; i < 5; i++) {
    const cx = ((i * 250 + time * 0.005) % (W + 300)) - 150;
    const cy = 80 + i * 30;
    const cloudGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
    cloudGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
    cloudGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = cloudGrad;
    ctx.beginPath(); ctx.ellipse(cx, cy, 80, 30, 0, 0, Math.PI*2); ctx.fill();
  }

  // Дальние здания с параллаксом
  ctx.fillStyle = '#7a8b98';
  const bgOff = camera.x * 0.2;
  for (let i = 0; i < 20; i++) {
    const bx = (i * 200 - bgOff % 200) - 100;
    const bh = 150 + (i * 37) % 120;
    const bldGrad = ctx.createLinearGradient(bx, H - 80 - bh, bx, H - 80);
    bldGrad.addColorStop(0, '#8a9ba8'); bldGrad.addColorStop(1, '#6a7b88');
    ctx.fillStyle = bldGrad;
    ctx.fillRect(bx, H - 80 - bh, 130, bh);
  }
  
  // Ближние здания с окнами
  const midOff = camera.x * 0.5;
  for (let i = 0; i < 20; i++) {
    const bx = (i * 250 - midOff % 250) - 100;
    const bh = 100 + (i * 53) % 100;
    const bldGrad = ctx.createLinearGradient(bx, H - 80 - bh, bx, H - 80);
    bldGrad.addColorStop(0, '#5a6b7a'); bldGrad.addColorStop(1, '#4a5b6a');
    ctx.fillStyle = bldGrad;
    ctx.fillRect(bx, H - 80 - bh, 160, bh);
    // Окна
    for (let wy = H - 70 - bh; wy < H - 90; wy += 25) {
      for (let wx = bx + 15; wx < bx + 145; wx += 30) {
        if ((wx + wy) % 7 < 4) {
          const winGrad = ctx.createLinearGradient(wx, wy, wx, wy + 15);
          winGrad.addColorStop(0, '#ffe082'); winGrad.addColorStop(1, '#ffb850');
          ctx.fillStyle = winGrad;
          ctx.fillRect(wx, wy, 12, 15);
          // Блик
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.fillRect(wx + 1, wy + 1, 3, 4);
        }
      }
    }
  }
  
  // Атмосферная дымка внизу
  const haze = ctx.createLinearGradient(0, H * 0.6, 0, H);
  haze.addColorStop(0, 'rgba(200, 220, 240, 0)');
  haze.addColorStop(1, 'rgba(200, 220, 240, 0.3)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, W, H);
}

// ==================== ПЛАТФОРМЫ ====================
function drawPlatforms() {
  for (const p of level.platforms) {
    if (currentLevel >= 3) {
      // Складские платформы
      if (p.w >= 100 && p.h >= 15) {
        // Ящик с объёмом
        const boxGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        boxGrad.addColorStop(0, '#a06a3a'); boxGrad.addColorStop(0.5, '#8b5a2b'); boxGrad.addColorStop(1, '#5a3a1a');
        ctx.fillStyle = boxGrad;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        // Доски
        ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 1;
        for (let bx = p.x + 10; bx < p.x + p.w; bx += 15) {
          ctx.beginPath(); ctx.moveTo(bx, p.y + 2); ctx.lineTo(bx, p.y + p.h - 2); ctx.stroke();
        }
        // Верхний блик
        ctx.fillStyle = 'rgba(255, 220, 180, 0.4)';
        ctx.fillRect(p.x, p.y, p.w, 3);
        // Тень снизу
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
        // Обводка
        ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
        // Металлические уголки
        ctx.fillStyle = '#888';
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.fillRect(p.x + p.w - 4, p.y, 4, 4);
        // Блики на уголках
        ctx.fillStyle = '#bbb';
        ctx.fillRect(p.x, p.y, 2, 2);
        ctx.fillRect(p.x + p.w - 4, p.y, 2, 2);
      }
    } else {
      // Травяные платформы
      const grassGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
      grassGrad.addColorStop(0, '#5e9e4a'); grassGrad.addColorStop(0.5, '#4a7c3a'); grassGrad.addColorStop(1, '#3a5c2a');
      ctx.fillStyle = grassGrad;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      // Трава сверху
      ctx.fillStyle = '#6ebe5a';
      ctx.fillRect(p.x, p.y, p.w, 4);
      // Травинки
      for (let tx = p.x + 5; tx < p.x + p.w - 5; tx += 8) {
        const h = 4 + Math.sin(tx * 0.3 + globalTime * 0.002) * 2;
        ctx.fillStyle = '#7ece6a';
        ctx.fillRect(tx, p.y - h, 2, h);
      }
      // Тень снизу
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
      // Блик сверху
      ctx.fillStyle = 'rgba(255, 255, 200, 0.2)';
      ctx.fillRect(p.x, p.y + 4, p.w, 2);
    }
  }
}

// ==================== ПОСТОБРАБОТКА ====================
function applyPostProcessing() {
  // Виньетка
  const vignette = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
  
  // Лёгкий bloom-оверлей (мягкий свет)
  if (player.powerTimer > 0) {
    ctx.fillStyle = 'rgba(255, 215, 0, 0.03)';
    ctx.fillRect(0, 0, W, H);
  }
  
  // Красный оверлей при уроне
  if (hitFlash > 0) {
    ctx.fillStyle = `rgba(255, 0, 0, ${hitFlash * 0.02})`;
    ctx.fillRect(0, 0, W, H);
  }
}
// ==================== ОБНОВЛЕНИЕ ====================
function update() {
  if (gameState === 'menu') return;

  if (gameState === 'levelComplete') {
    stateTimer++;
    if (stateTimer > 90) {
      if (bossDefeated || currentLevel >= LEVELS.length - 1) {
        gameState = 'menu';
        player = createPlayer();
        stateTimer = 0;
        return;
      }
      if (currentLevel < LEVELS.length - 1) loadLevel(currentLevel + 1);
    }
    return;
  }
  if (gameState === 'gameOver') {
    stateTimer++;
    if (stateTimer > 120 && keys['Space']) {
      gameState = 'menu';
      player = createPlayer();
    }
    return;
  }

  if (bossIntroTimer > 0) {
    bossIntroTimer--;
    player.vx = 0;
    if (bossIntroTimer === 0) boss.state = 'chase';
  }

  if (screenShake > 0) screenShake *= 0.9;
  if (screenShake < 0.5) screenShake = 0;
  if (hitFlash > 0) hitFlash--;

  const powered = player.powerTimer > 0;
  const currentSpeed = powered ? BASE_SPEED * 1.2 : BASE_SPEED;
  const currentJump = powered ? BASE_JUMP * 1.15 : BASE_JUMP;

  if (bossIntroTimer <= 0) {
    if (keys['ArrowLeft'] || keys['KeyA'])  { player.vx = -currentSpeed; player.facing = -1; }
    else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = currentSpeed; player.facing = 1; }
    else player.vx = 0;

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
      player.vy = currentJump; player.onGround = false; sfx.jump();
    }

    if (keys['KeyE'] && powered && hammerCooldown <= 0 && hammers.length < 3) {
      hammers.push({
        x: player.x + player.w/2 + player.facing * 20,
        y: player.y + player.h * 0.4,
        vx: player.facing * 9, vy: -3,
        rotation: 0, rotationSpeed: player.facing * 0.4,
        life: 180, w: 20, h: 24
      });
      hammerCooldown = 30;
      sfx.hammerThrow();
      player.vx = -player.facing * 2;
      spawnParticles(player.x + player.w/2, player.y + player.h*0.4, '#ffd700', 6);
    }
  } else {
    player.vx = 0;
  }
  if (hammerCooldown > 0) hammerCooldown--;

  player.vy += GRAVITY;
  player.x += player.vx;
  for (const p of level.platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  }
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > level.width) player.x = level.width - player.w;

  const wasOnGround = player.onGround;
  player.y += player.vy;
  player.onGround = false;
  for (const p of level.platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true;
        if (!wasOnGround) player.landTime = 10;
      } else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
    }
  }

  if (player.onGround && Math.abs(player.vx) > 0.1) player.walkTime += 0.2;
  else player.walkTime += (Math.round(player.walkTime / Math.PI) * Math.PI - player.walkTime) * 0.2;
  if (player.landTime > 0) player.landTime -= 1;
  if (player.invuln > 0) player.invuln -= 1;

  if (player.powerTimer > 0) {
    player.powerTimer -= 1;
    if (player.powerTimer === 0) {
      sfx.powerEnd();
      spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ffd700', 20);
      for (const h of hammers) spawnParticles(h.x, h.y, '#ffd700', 10);
      hammers = [];
    }
    if (player.powerTimer > 0 && Math.random() < 0.4) {
      spawnParticles(
        player.x + player.w/2 + (Math.random()-0.5)*40,
        player.y + player.h/2 + (Math.random()-0.5)*60,
        Math.random() < 0.5 ? '#ffd700' : '#ffaa00', 1
      );
    }
  }

  if (player.y > H + 100) {
    player.hp -= 1; player.invuln = 60; sfx.hurt(); hitFlash = 15;
    player.x = 50; player.y = 100; player.vy = 0;
    if (currentLevel === 4) player.x = 50;
  }

  // БОСС
  if (boss && boss.hp > 0 && bossIntroTimer <= 0) {
    boss.vy += GRAVITY;
    boss.x += boss.vx;
    for (const p of level.platforms) {
      if (rectsOverlap(boss, p)) {
        if (boss.vx > 0) boss.x = p.x - boss.w;
        else if (boss.vx < 0) boss.x = p.x + p.w;
      }
    }
    if (boss.x < 400) boss.x = 400;
    if (boss.x + boss.w > level.width - 50) boss.x = level.width - 50 - boss.w;
    boss.y += boss.vy;
    boss.onGround = false;
    for (const p of level.platforms) {
      if (rectsOverlap(boss, p)) {
        if (boss.vy > 0) {
          boss.y = p.y - boss.h; boss.vy = 0; boss.onGround = true;
          if (boss.state === 'jump') {
            boss.state = 'chase';
            screenShake = 8;
            spawnParticles(boss.x + boss.w/2, boss.y + boss.h, '#ff4444', 20);
          }
        } else if (boss.vy < 0) { boss.y = p.y + p.h; boss.vy = 0; }
      }
    }
    if (boss.onGround) boss.walkTime += 0.2;
    if (boss.hitFlash > 0) boss.hitFlash--;
    if (boss.invuln > 0) boss.invuln--;
    if (boss.attackTimer > 0) boss.attackTimer--;
    if (boss.jumpCooldown > 0) boss.jumpCooldown--;
    if (boss.throwCooldown > 0) boss.throwCooldown--;

    const dx = (player.x + player.w/2) - (boss.x + boss.w/2);
    const dist = Math.abs(dx);

    if (boss.hp <= boss.maxHp / 2 && boss.phase === 1) {
      boss.phase = 2;
      sfx.bossRoar();
      screenShake = 15;
      spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ff0000', 30, 10);
    }

    if (boss.state === 'chase') {
      const speed = boss.phase === 2 ? 3.5 : 2.2;
      boss.vx = Math.sign(dx) * speed;
      boss.facing = Math.sign(dx) || 1;
      if (boss.jumpCooldown <= 0 && boss.onGround && dist > 100 && dist < 400) {
        boss.state = 'jump'; boss.vy = -14;
        boss.jumpTargetX = player.x;
        boss.jumpCooldown = boss.phase === 2 ? 90 : 150;
      } else if (boss.throwCooldown <= 0 && boss.onGround && dist > 150) {
        boss.state = 'throw'; boss.attackTimer = 30;
        boss.throwCooldown = boss.phase === 2 ? 60 : 100;
      }
    } else if (boss.state === 'jump') {
      boss.vx = Math.sign(boss.jumpTargetX - boss.x) * 4;
      boss.facing = Math.sign(boss.vx) || 1;
    } else if (boss.state === 'throw') {
      boss.vx *= 0.8;
      boss.facing = Math.sign(dx) || 1;
      if (boss.attackTimer === 20) {
        for (let i = -1; i <= 1; i++) {
          bags.push({
            x: boss.x + boss.w/2, y: boss.y + boss.h*0.4,
            vx: Math.sign(dx) * 6, vy: -4 + i * 1.5,
            w: 18, h: 14, life: 200, spin: 0, isBossBag: true
          });
        }
        sfx.throw();
      }
      if (boss.attackTimer <= 0) boss.state = 'chase';
    }

    if (rectsOverlap(player, boss) && player.invuln <= 0 && boss.invuln <= 0) {
      if (player.vy > 0 && player.y + player.h - player.vy <= boss.y + 15) {
        boss.hp -= 1; boss.hitFlash = 15; boss.invuln = 30;
        player.vy = -10; player.score += 200;
        sfx.bossHit(); screenShake = 10; hitFlash = 8;
        spawnParticles(boss.x + boss.w/2, boss.y, '#ffd700', 20);
        spawnParticles(boss.x + boss.w/2, boss.y, '#ff4444', 15);
        if (boss.hp <= 0) {
          bossDefeated = true; sfx.victory(); screenShake = 20;
          spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd700', 50, 12);
          spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ff4444', 30, 10);
          player.score += 1000;
          setTimeout(() => { if (gameState === 'playing') { gameState = 'levelComplete'; stateTimer = 0; } }, 2000);
        }
      } else {
        player.hp -= 1; player.invuln = 60;
        player.vx = -Math.sign(dx) * 8; player.vy = -7;
        sfx.hurt(); screenShake = 8; hitFlash = 15;
        spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 10);
      }
    }
  }

  // МОЛОТЫ
  for (let i = hammers.length - 1; i >= 0; i--) {
    const h = hammers[i];
    h.vy += GRAVITY * 0.5;
    h.x += h.vx; h.y += h.vy;
    h.rotation += h.rotationSpeed; h.life--;
    if (Math.random() < 0.5) spawnParticles(h.x, h.y, Math.random() < 0.5 ? '#ffd700' : '#ffaa00', 1);
    let destroyed = false;
    if (!destroyed && boss && boss.hp > 0 && boss.invuln <= 0) {
      if (rectsOverlap({x: h.x - 12, y: h.y - 12, w: 24, h: 24}, boss)) {
        boss.hp -= 1; boss.hitFlash = 15; boss.invuln = 30;
        player.score += 200; sfx.bossHit(); screenShake = 10; hitFlash = 8;
        spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd700', 20);
        destroyed = true;
        if (boss.hp <= 0) {
          bossDefeated = true; sfx.victory(); screenShake = 20;
          spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd700', 50, 12);
          player.score += 1000;
          setTimeout(() => { if (gameState === 'playing') { gameState = 'levelComplete'; stateTimer = 0; } }, 2000);
        }
      }
    }
    if (!destroyed) {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (rectsOverlap({x: h.x - 12, y: h.y - 12, w: 24, h: 24}, e)) {
          e.alive = false; player.score += 100; sfx.hammerHit();
          spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ffd700', 15);
          spawnParticles(e.x + e.w/2, e.y + e.h/2, e.color, 10);
          destroyed = true; break;
        }
      }
    }
    if (!destroyed) {
      for (let j = bags.length - 1; j >= 0; j--) {
        const b = bags[j];
        if (rectsOverlap({x: h.x - 12, y: h.y - 12, w: 24, h: 24}, b)) {
          bags.splice(j, 1); player.score += 20; sfx.hammerHit();
          spawnParticles(b.x, b.y, '#ff69b4', 8);
          spawnParticles(b.x, b.y, '#ffd700', 6);
          destroyed = true; break;
        }
      }
    }
    if (!destroyed) {
      for (const p of level.platforms) {
        if (rectsOverlap({x: h.x - 12, y: h.y - 12, w: 24, h: 24}, p)) {
          sfx.hammerHit();
          spawnParticles(h.x, h.y, '#ffd700', 12);
          spawnParticles(h.x, h.y, '#ffaa00', 8);
          destroyed = true; break;
        }
      }
    }
    if (h.x < -50 || h.x > level.width + 50 || h.y > H + 100) destroyed = true;
    if (h.life <= 0) destroyed = true;
    if (destroyed) hammers.splice(i, 1);
  }

  // ОСЬМИНОГИ
  for (const o of octopuses) {
    if (!o.taken && Math.hypot((player.x+player.w/2)-o.x, (player.y+player.h/2)-o.y) < o.r+15) {
      o.taken = true; player.score += 10; sfx.coin();
      spawnParticles(o.x, o.y, '#c86bff', 12);
      spawnParticles(o.x, o.y, '#ff8df0', 6);
    }
  }

  // БОНУС
  if (goldenPower && !goldenPower.taken) {
    const dx = (player.x+player.w/2) - goldenPower.x;
    const dy = (player.y+player.h/2) - goldenPower.y;
    if (Math.hypot(dx, dy) < goldenPower.r + 18) {
      goldenPower.taken = true;
      player.powerTimer = POWER_DURATION;
      player.score += 100;
      sfx.powerup();
      spawnParticles(goldenPower.x, goldenPower.y, '#ffd700', 30);
      spawnParticles(goldenPower.x, goldenPower.y, '#ff8c00', 20);
      spawnParticles(goldenPower.x, goldenPower.y, '#fff', 15);
    }
  }

  // ВРАГИ
  for (const e of enemies) {
    if (!e.alive) continue;
    e.vy += GRAVITY;
    e.x += e.vx;
    for (const p of level.platforms) {
      if (rectsOverlap(e, p)) {
        if (e.vx > 0) e.x = p.x - e.w;
        else if (e.vx < 0) e.x = p.x + p.w;
      }
    }
    e.y += e.vy;
    e.onGround = false;
    for (const p of level.platforms) {
      if (rectsOverlap(e, p)) {
        if (e.vy > 0) { e.y = p.y - e.h; e.vy = 0; e.onGround = true; }
        else if (e.vy < 0) { e.y = p.y + p.h; e.vy = 0; }
      }
    }
    if (e.y > H + 100) { e.alive = false; continue; }
    const dx = (player.x + player.w/2) - (e.x + e.w/2);
    const dist = Math.abs(dx);
    if (dist < 180 && player.y < e.y + 80) e.state = 'chase';
    else if (dist > 250) e.state = 'patrol';
    if (e.state === 'chase') {
      e.vx = Math.sign(dx) * e.chaseSpeed;
      e.facing = Math.sign(dx) || 1;
      if (e.onGround && Math.random() < e.throwRate && Math.abs(player.y - e.y) < 120) {
        bags.push({
          x: e.x + e.w/2, y: e.y + e.h*0.5,
          vx: Math.sign(dx) * 5, vy: -4, w: 16, h: 12, life: 180, spin: 0
        });
        sfx.throw();
      }
    } else {
      if (e.x <= e.patrolMin) e.vx = e.speed;
      else if (e.x + e.w >= e.patrolMax) e.vx = -e.speed;
      else if (e.vx === 0) e.vx = e.speed;
      e.facing = Math.sign(e.vx) || 1;
    }
    if (e.onGround) e.walkTime += 0.2;
    if (rectsOverlap(player, e)) {
      if (powered) {
        e.alive = false; player.score += 100; sfx.stomp();
        spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ffd700', 15);
        spawnParticles(e.x + e.w/2, e.y + e.h/2, e.color, 10);
      } else if (player.invuln <= 0) {
        if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 12) {
          e.alive = false; player.vy = -9; player.score += 50; sfx.stomp();
          spawnParticles(e.x + e.w/2, e.y + e.h/2, e.color, 12);
        } else {
          player.hp -= 1; player.invuln = 60;
          player.vx = -Math.sign(dx) * 6; player.vy = -6;
          sfx.hurt(); hitFlash = 15;
          spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 8);
        }
      }
    }
  }

  // СУМОЧКИ
  for (let i = bags.length - 1; i >= 0; i--) {
    const b = bags[i];
    b.vy += GRAVITY * 0.6;
    b.x += b.vx; b.y += b.vy;
    b.spin += 0.2; b.life--;
    if (rectsOverlap(player, b)) {
      if (powered) { spawnParticles(b.x, b.y, '#ffd700', 8); bags.splice(i, 1); continue; }
      else if (player.invuln <= 0) {
        player.hp -= 1; player.invuln = 60;
        player.vx = Math.sign(b.vx) * 5; player.vy = -5;
        sfx.hurt(); hitFlash = 15;
        spawnParticles(b.x, b.y, '#ff69b4', 8);
        bags.splice(i, 1); continue;
      }
    }
    for (const p of level.platforms) {
      if (rectsOverlap(b, p)) {
        spawnParticles(b.x, b.y, b.isBossBag ? '#ff4444' : '#ff69b4', 6);
        bags.splice(i, 1); break;
      }
    }
    if (b.life <= 0 || b.y > H + 100) bags.splice(i, 1);
  }

  // ЧАСТИЦЫ
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.3;
    pt.vx *= 0.98;
    pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  // КАМЕРА
  const targetCamX = player.x + player.w/2 - W/2;
  camera.x += (targetCamX - camera.x) * 0.1;
  camera.x = Math.max(0, Math.min(level.width - W, camera.x));

  if (rectsOverlap(player, level.exit) && !level.isBossLevel) {
    gameState = 'levelComplete'; stateTimer = 0; sfx.levelup();
  }
  if (player.hp <= 0) {
    gameState = 'gameOver'; stateTimer = 0; sfx.gameover();
  }
}

// ==================== ОТРИСОВКА ИГРЫ ====================
function drawGame() {
  const time = globalTime;
  let shakeX = 0, shakeY = 0;
  if (screenShake > 0.5) {
    shakeX = (Math.random() - 0.5) * screenShake * 2;
    shakeY = (Math.random() - 0.5) * screenShake * 2;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();

  ctx.save();
  ctx.translate(-camera.x, 0);

  drawPlatforms();

  // Выход
  if (!level.isBossLevel || bossDefeated) {
    const exitPulse = Math.sin(time/200) * 0.3 + 0.7;
    const exitGlow = ctx.createRadialGradient(level.exit.x + level.exit.w/2, level.exit.y + level.exit.h/2, 0, level.exit.x + level.exit.w/2, level.exit.y + level.exit.h/2, 80);
    exitGlow.addColorStop(0, `rgba(100, 255, 100, ${0.4 * exitPulse})`);
    exitGlow.addColorStop(1, 'rgba(100, 255, 100, 0)');
    ctx.fillStyle = exitGlow;
    ctx.beginPath(); ctx.arc(level.exit.x + level.exit.w/2, level.exit.y + level.exit.h/2, 80, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(100, 255, 100, ${exitPulse})`;
    ctx.fillRect(level.exit.x, level.exit.y, level.exit.w, level.exit.h);
    ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 3;
    ctx.strokeRect(level.exit.x, level.exit.y, level.exit.w, level.exit.h);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('ВЫХОД', level.exit.x + level.exit.w/2, level.exit.y - 10);
    ctx.textAlign = 'left';
  }

  for (const o of octopuses) drawOctopus(o, time);
  drawGoldenPower(goldenPower, time);
  for (const e of enemies) drawEnemyGirl(e);
  if (boss && boss.hp > 0) drawBoss(boss, time);

  // Сумочки
  for (const b of bags) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.spin);
    const bagGrad = ctx.createLinearGradient(-b.w/2, -b.h/2, b.w/2, b.h/2);
    const c1 = b.isBossBag ? '#ff6666' : '#ff88cc';
    const c2 = b.isBossBag ? '#8b0000' : '#c71585';
    bagGrad.addColorStop(0, c1); bagGrad.addColorStop(1, c2);
    ctx.fillStyle = bagGrad;
    roundRect(ctx, -b.w/2, -b.h/2, b.w, b.h, 3); ctx.fill();
    ctx.strokeStyle = b.isBossBag ? '#5a0000' : '#8b0040'; ctx.lineWidth = 2; ctx.stroke();
    // Блик
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(-b.w/2 + 2, -b.h/2 + 2, b.w/3, 2);
    ctx.restore();
  }

  for (const h of hammers) drawFlyingHammer(h, time);

  // Частицы (мягкие)
  for (const pt of particles) {
    ctx.globalAlpha = pt.life / pt.maxLife;
    if (pt.soft) {
      const pgrad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.size * 2);
      pgrad.addColorStop(0, pt.color);
      pgrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pgrad;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * 2, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  drawCharacter(player);
  ctx.restore();

  // Золотая рамка
  if (player.powerTimer > 0) {
    const glow = 12 + Math.sin(Date.now()/150) * 6;
    ctx.strokeStyle = `rgba(255, 215, 0, 0.7)`;
    ctx.lineWidth = glow;
    ctx.strokeRect(glow/2, glow/2, W - glow, H - glow);
    ctx.strokeStyle = `rgba(255, 255, 255, 0.4)`;
    ctx.lineWidth = 2;
    ctx.strokeRect(glow, glow, W - glow*2, H - glow*2);
  }

  ctx.restore();

  // Постобработка
  applyPostProcessing();

  // HUD
  drawHUD();

  // Экраны состояний
  if (gameState === 'levelComplete') drawLevelComplete();
  if (gameState === 'gameOver') drawGameOver();
}

// ==================== HUD ====================
function drawHUD() {
  // Стеклянная панель
  ctx.save();
  const hudGrad = ctx.createLinearGradient(0, 0, 0, 80);
  hudGrad.addColorStop(0, 'rgba(20, 10, 40, 0.85)');
  hudGrad.addColorStop(1, 'rgba(10, 5, 20, 0.7)');
  ctx.fillStyle = hudGrad;
  ctx.fillRect(0, 0, W, 80);
  // Блик сверху
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, 0, W, 1);
  // Тень снизу
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 79, W, 1);
  ctx.restore();

  // Уровень
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
  ctx.fillText('Уровень ' + (currentLevel+1) + ' / ' + LEVELS.length + ': ' + level.name, 20, 32);
  ctx.font = 'bold 18px sans-serif';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('Очки: ' + player.score, 20, 62);

  // Сердечки с объёмом
  for (let i = 0; i < player.maxHp; i++) {
    const hx = 340 + i * 32, hy = 40;
    if (i < player.hp) {
      const heartGrad = ctx.createRadialGradient(hx+5, hy+5, 0, hx+10, hy+10, 15);
      heartGrad.addColorStop(0, '#ff6b6b'); heartGrad.addColorStop(0.5, '#e63946'); heartGrad.addColorStop(1, '#8b0000');
      ctx.fillStyle = heartGrad;
    } else {
      ctx.fillStyle = '#333';
    }
    ctx.beginPath();
    ctx.moveTo(hx+10, hy+18);
    ctx.bezierCurveTo(hx+10, hy+10, hx-3, hy+10, hx-3, hy+2);
    ctx.bezierCurveTo(hx-3, hy-3, hx+5, hy-3, hx+10, hy+4);
    ctx.bezierCurveTo(hx+15, hy-3, hx+23, hy-3, hx+23, hy+2);
    ctx.bezierCurveTo(hx+23, hy+10, hx+10, hy+10, hx+10, hy+18);
    ctx.fill();
    // Блик
    if (i < player.hp) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.ellipse(hx+5, hy+3, 2, 1.5, -0.5, 0, Math.PI*2); ctx.fill();
    }
  }

  // Счётчик осьминогов
  const totalOct = octopuses.length, takenOct = octopuses.filter(o=>o.taken).length;
  ctx.save();
  ctx.translate(W - 260, 42);
  const hudGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, 18);
  hudGlow.addColorStop(0, 'rgba(180, 80, 255, 0.6)');
  hudGlow.addColorStop(1, 'rgba(100, 0, 180, 0)');
  ctx.fillStyle = hudGlow;
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
  const miniBody = ctx.createRadialGradient(-2, -3, 0, 0, 0, 8);
  miniBody.addColorStop(0, '#e88bff'); miniBody.addColorStop(1, '#6a1090');
  ctx.fillStyle = miniBody;
  ctx.beginPath(); ctx.ellipse(0, -2, 6, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-2.5, -1, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(2.5, -1, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a0030';
  ctx.beginPath(); ctx.arc(-2.5, -0.5, 0.9, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(2.5, -0.5, 0.9, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.fillText(takenOct + ' / ' + totalOct, W - 230, 48);

  // Мини-карта
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  roundRect(ctx, W - 200, 58, 180, 8, 4); ctx.fill();
  const mapGrad = ctx.createLinearGradient(W - 200, 0, W - 20, 0);
  mapGrad.addColorStop(0, '#b86bff'); mapGrad.addColorStop(1, '#ff8df0');
  ctx.fillStyle = mapGrad;
  roundRect(ctx, W - 200, 58, 180 * (player.x / level.width), 8, 4); ctx.fill();

  // Босс HP
  if (boss && boss.hp > 0 && bossIntroTimer <= 0) {
    const barW = 600, barH = 28;
    const bx = W/2 - barW/2, by = H - 60;
    // Стеклянная панель
    ctx.fillStyle = 'rgba(10, 5, 20, 0.85)';
    roundRect(ctx, bx - 8, by - 34, barW + 16, barH + 42, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
    roundRect(ctx, bx - 8, by - 34, barW + 16, barH + 42, 10); ctx.stroke();

    ctx.fillStyle = boss.phase === 2 ? '#ff4444' : '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ИРИНА' + (boss.phase === 2 ? ' — ЯРОСТЬ!' : ''), W/2, by - 12);

    ctx.fillStyle = '#1a0a1a';
    roundRect(ctx, bx, by, barW, barH, 6); ctx.fill();

    const hpPct = boss.hp / boss.maxHp;
    const grad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
    if (boss.phase === 2) {
      grad.addColorStop(0, '#ff0000'); grad.addColorStop(0.5, '#ff4444'); grad.addColorStop(1, '#ff8800');
    } else {
      grad.addColorStop(0, '#8b0000'); grad.addColorStop(0.5, '#c0392b'); grad.addColorStop(1, '#e74c3c');
    }
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by, barW * hpPct, barH, 6); ctx.fill();
    // Блик на полоске
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    roundRect(ctx, bx, by, barW * hpPct, barH/2, 6); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    roundRect(ctx, bx, by, barW, barH, 6); ctx.stroke();

    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
    for (let i = 1; i < boss.maxHp; i++) {
      ctx.beginPath();
      ctx.moveTo(bx + barW * i / boss.maxHp, by);
      ctx.lineTo(bx + barW * i / boss.maxHp, by + barH);
      ctx.stroke();
    }
    ctx.textAlign = 'left';
  }

  // Интро босса
  if (bossIntroTimer > 0) drawBossIntro();

  // Бонус-таймер
  if (player.powerTimer > 0) {
    const pct = player.powerTimer / POWER_DURATION;
    const barW = 260, barH = 28;
    const bx = W/2 - barW/2, by = 90;
    ctx.fillStyle = 'rgba(10, 5, 20, 0.85)';
    roundRect(ctx, bx - 6, by - 6, barW + 12, barH + 12, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,0,0.4)'; ctx.lineWidth = 1;
    roundRect(ctx, bx - 6, by - 6, barW + 12, barH + 12, 8); ctx.stroke();

    const grad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
    grad.addColorStop(0, '#ffd700'); grad.addColorStop(0.5, '#fff8b0'); grad.addColorStop(1, '#ffa500');
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by, barW * pct, barH, 4); ctx.fill();
    // Блик
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    roundRect(ctx, bx, by, barW * pct, barH/2, 4); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    const secs = Math.ceil(player.powerTimer / 60);
    ctx.fillText('★ СЕРП И МОЛОТ ★  ' + secs + ' сек', W/2, by + 20);
    ctx.textAlign = 'left';
  }

  // Подсказка
  ctx.font = '13px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  if (player.powerTimer > 0) {
    ctx.fillStyle = '#ffd700';
    ctx.fillText('← → — идти  |  Space — прыжок  |  E — БРОСИТЬ МОЛОТ!  |  M — звук', 20, H - 15);
  } else {
    ctx.fillText('← → — идти  |  Space — прыжок  |  Прыжок сверху — победить врага  |  M — звук', 20, H - 15);
  }
}

// ==================== ИНТРО БОССА ====================
function drawBossIntro() {
  const alpha = Math.min(1, bossIntroTimer / 30);
  ctx.fillStyle = `rgba(0,0,0,${0.75 * alpha})`;
  ctx.fillRect(0, 0, W, H);
  
  // Красное свечение
  const glow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 300);
  glow.addColorStop(0, `rgba(255, 50, 50, ${0.3 * alpha})`);
  glow.addColorStop(1, 'rgba(255, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(W/2, H/2, 300, 0, Math.PI*2); ctx.fill();

  ctx.textAlign = 'center';
  ctx.shadowColor = `rgba(255, 50, 50, ${alpha})`;
  ctx.shadowBlur = 40;
  ctx.fillStyle = `rgba(255, 50, 50, ${alpha})`;
  ctx.font = 'bold 72px sans-serif';
  ctx.fillText('ИРИНА', W/2, H/2 - 40);
  ctx.shadowBlur = 15;
  ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('ХОЗЯЙКА СКЛАДА', W/2, H/2 + 20);
  ctx.shadowBlur = 0;
  ctx.fillStyle = `rgba(255, 200, 200, ${alpha * 0.8})`;
  ctx.font = '20px sans-serif';
  ctx.fillText('Готовься к бою...', W/2, H/2 + 70);
  ctx.textAlign = 'left';
  ctx.shadowColor = 'transparent';
}

// ==================== ЭКРАНЫ ====================
function drawLevelComplete() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (bossDefeated) {
    // Золотое свечение
    const glow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 400);
    glow.addColorStop(0, 'rgba(255, 215, 0, 0.2)');
    glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 30;
    const titleGrad = ctx.createLinearGradient(0, H/2 - 80, 0, H/2 - 10);
    titleGrad.addColorStop(0, '#fff8b0'); titleGrad.addColorStop(1, '#ffd700');
    ctx.fillStyle = titleGrad;
    ctx.font = 'bold 72px sans-serif';
    ctx.fillText('ПОБЕДА!', W/2, H/2 - 40);
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif';
    ctx.fillText('Ирина побеждена!', W/2, H/2 + 20);
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 32px sans-serif';
    ctx.fillText('Итоговый счёт: ' + player.score, W/2, H/2 + 80);
    if (stateTimer > 120) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '20px sans-serif';
      const blink = Math.sin(stateTimer * 0.1) * 0.5 + 0.5;
      ctx.fillStyle = `rgba(255, 215, 0, ${0.5 + blink * 0.5})`;
      ctx.fillText('Нажмите ПРОБЕЛ для рестарта', W/2, H/2 + 140);
    }
  } else {
    ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 56px sans-serif';
    ctx.fillText('УРОВЕНЬ ПРОЙДЕН!', W/2, H/2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif';
    ctx.fillText('Очки: ' + player.score, W/2, H/2 + 30);
  }
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const glow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 350);
  glow.addColorStop(0, 'rgba(255, 0, 0, 0.2)');
  glow.addColorStop(1, 'rgba(255, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  
  ctx.shadowColor = '#e63946'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#e63946'; ctx.font = 'bold 64px sans-serif';
  ctx.fillText('GAME OVER', W/2, H/2 - 40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff'; ctx.font = '28px sans-serif';
  ctx.fillText('Итоговый счёт: ' + player.score, W/2, H/2 + 20);
  if (stateTimer > 120) {
    const blink = Math.sin(stateTimer * 0.1) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255, 215, 0, ${0.5 + blink * 0.5})`;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('Нажмите ПРОБЕЛ для рестарта', W/2, H/2 + 80);
  }
  ctx.textAlign = 'left';
}

// ==================== МЕНЮ ====================
function drawMenu(time) {
  // Кинематографичный фон
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0518');
  grad.addColorStop(0.4, '#1a0a2e');
  grad.addColorStop(0.7, '#2d1b4e');
  grad.addColorStop(1, '#050510');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Звёзды
  for (let i = 0; i < 80; i++) {
    const sx = (i * 137 + 50) % W;
    const sy = (i * 83 + 30) % H;
    const twinkle = Math.sin(time * 0.002 + i) * 0.5 + 0.5;
    const size = 0.5 + twinkle * 1.5;
    ctx.fillStyle = `rgba(220, 180, 255, ${0.2 + twinkle * 0.7})`;
    ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI*2); ctx.fill();
    // Свечение у ярких
    if (twinkle > 0.7) {
      const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 8);
      sg.addColorStop(0, 'rgba(220, 180, 255, 0.4)');
      sg.addColorStop(1, 'rgba(220, 180, 255, 0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(sx, sy, 8, 0, Math.PI*2); ctx.fill();
    }
  }

  // Туманности
  const nebula1 = ctx.createRadialGradient(W*0.2, H*0.3, 0, W*0.2, H*0.3, 350);
  nebula1.addColorStop(0, 'rgba(150, 50, 200, 0.25)');
  nebula1.addColorStop(1, 'rgba(50, 0, 100, 0)');
  ctx.fillStyle = nebula1;
  ctx.beginPath(); ctx.arc(W*0.2, H*0.3, 350, 0, Math.PI*2); ctx.fill();

  const nebula2 = ctx.createRadialGradient(W*0.8, H*0.7, 0, W*0.8, H*0.7, 300);
  nebula2.addColorStop(0, 'rgba(100, 50, 200, 0.25)');
  nebula2.addColorStop(1, 'rgba(30, 0, 80, 0)');
  ctx.fillStyle = nebula2;
  ctx.beginPath(); ctx.arc(W*0.8, H*0.7, 300, 0, Math.PI*2); ctx.fill();

  // Заголовок
  const titleGlow = Math.sin(time * 0.003) * 0.3 + 0.7;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = `rgba(180, 100, 255, ${titleGlow})`;
  ctx.shadowBlur = 40;
  const titleGrad = ctx.createLinearGradient(0, 50, 0, 170);
  titleGrad.addColorStop(0, '#fff8b0');
  titleGrad.addColorStop(0.5, '#ffd700');
  titleGrad.addColorStop(1, '#ff6b9d');
  ctx.fillStyle = titleGrad;
  ctx.font = 'bold 52px sans-serif';
  ctx.fillText('Никита.', W/2, 90);
  ctx.fillText('Битва за смены', W/2, 150);
  ctx.shadowBlur = 15;
  ctx.fillText('Никита.', W/2, 90);
  ctx.fillText('Битва за смены', W/2, 150);
  ctx.restore();
  
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(200, 180, 255, 0.75)';
  ctx.font = 'italic 16px sans-serif';
  ctx.fillText('Приключение в 5 уровнях', W/2, 185);

  // Никита с осьминогом
  const nikitaX = W * 0.35;
  const nikitaY = H * 0.42;
  const nikitaScale = 3.2;

  // Сцена — пол под Никитой
  const floorGrad = ctx.createRadialGradient(nikitaX, nikitaY + 200, 0, nikitaX, nikitaY + 200, 250);
  floorGrad.addColorStop(0, 'rgba(150, 80, 255, 0.35)');
  floorGrad.addColorStop(0.5, 'rgba(100, 40, 200, 0.15)');
  floorGrad.addColorStop(1, 'rgba(50, 0, 100, 0)');
  ctx.fillStyle = floorGrad;
  ctx.beginPath(); ctx.ellipse(nikitaX, nikitaY + 200, 250, 60, 0, 0, Math.PI*2); ctx.fill();

  // Никита
  const menuPlayer = {
    x: nikitaX - 15, y: nikitaY - 100, w: 30, h: 64,
    vx: 0, vy: 0, onGround: true, facing: 1,
    walkTime: 0, landTime: 0, invuln: 0, powerTimer: 0
  };
  drawCharacter(menuPlayer, nikitaScale, nikitaX, nikitaY + 200, true);

  // Осьминог на плече
  const octoX = nikitaX + 38;
  const octoY = nikitaY - 115;
  const octoPulse = Math.sin(time * 0.005) * 0.15 + 1;
  const octoR = 22 * octoPulse;

  // Свечение
  const octoGlow = ctx.createRadialGradient(octoX, octoY, 0, octoX, octoY, octoR * 4);
  octoGlow.addColorStop(0, 'rgba(200, 100, 255, 0.6)');
  octoGlow.addColorStop(0.4, 'rgba(160, 60, 230, 0.25)');
  octoGlow.addColorStop(1, 'rgba(100, 20, 180, 0)');
  ctx.fillStyle = octoGlow;
  ctx.beginPath(); ctx.arc(octoX, octoY, octoR * 4, 0, Math.PI*2); ctx.fill();

  // Щупальца
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2 + Math.PI/2;
    const wave = Math.sin(time * 0.008 + i * 0.8) * 0.5;
    const tx = octoX + Math.cos(angle + wave * 0.3) * octoR * 1.9;
    const ty = octoY + Math.sin(angle + wave * 0.3) * octoR * 1.9 + octoR * 0.3;
    const tentGrad = ctx.createLinearGradient(octoX, octoY, tx, ty);
    tentGrad.addColorStop(0, '#d67bff'); tentGrad.addColorStop(1, '#8a30c0');
    ctx.strokeStyle = tentGrad;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(octoX + Math.cos(angle) * octoR * 0.6, octoY + Math.sin(angle) * octoR * 0.6);
    ctx.quadraticCurveTo(
      octoX + Math.cos(angle) * octoR * 1.2 + Math.sin(wave) * 4,
      octoY + Math.sin(angle) * octoR * 1.2,
      tx, ty
    );
    ctx.stroke();
    ctx.fillStyle = '#f0c0ff';
    ctx.beginPath(); ctx.arc(tx, ty, 2.2, 0, Math.PI*2); ctx.fill();
    // Свечение на кончике
    const tipGlow = ctx.createRadialGradient(tx, ty, 0, tx, ty, 6);
    tipGlow.addColorStop(0, 'rgba(255, 200, 255, 0.8)');
    tipGlow.addColorStop(1, 'rgba(255, 200, 255, 0)');
    ctx.fillStyle = tipGlow;
    ctx.beginPath(); ctx.arc(tx, ty, 6, 0, Math.PI*2); ctx.fill();
  }

  // Тело
  const bodyGrad = ctx.createRadialGradient(octoX - octoR*0.35, octoY - octoR*0.4, 0, octoX, octoY, octoR * 1.3);
  bodyGrad.addColorStop(0, '#e88bff'); bodyGrad.addColorStop(0.4, '#b040e0'); bodyGrad.addColorStop(0.8, '#6a1090'); bodyGrad.addColorStop(1, '#3a0050');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.ellipse(octoX, octoY - octoR*0.2, octoR * 0.9, octoR * 1.1, 0, 0, Math.PI*2); ctx.fill();

  // Блик
  const hl = ctx.createRadialGradient(octoX - octoR*0.4, octoY - octoR*0.6, 0, octoX - octoR*0.4, octoY - octoR*0.6, octoR*0.5);
  hl.addColorStop(0, 'rgba(255, 230, 255, 0.85)');
  hl.addColorStop(1, 'rgba(255, 230, 255, 0)');
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.ellipse(octoX - octoR*0.4, octoY - octoR*0.6, octoR*0.35, octoR*0.45, -0.3, 0, Math.PI*2); ctx.fill();

  // Глаза
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(octoX - octoR*0.35, octoY - octoR*0.15, octoR*0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(octoX + octoR*0.35, octoY - octoR*0.15, octoR*0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a0030';
  ctx.beginPath(); ctx.arc(octoX - octoR*0.35, octoY - octoR*0.1, octoR*0.16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(octoX + octoR*0.35, octoY - octoR*0.1, octoR*0.16, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(octoX - octoR*0.3, octoY - octoR*0.15, octoR*0.07, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(octoX + octoR*0.4, octoY - octoR*0.15, octoR*0.07, 0, Math.PI*2); ctx.fill();

  // Облако диалога
  const nikitaZone = { x: nikitaX - 100, y: nikitaY - 100, w: 200, h: 250 };
  const isHovering = mouse.x >= nikitaZone.x && mouse.x <= nikitaZone.x + nikitaZone.w &&
                     mouse.y >= nikitaZone.y && mouse.y <= nikitaZone.y + nikitaZone.h;
  
  if (isHovering && !lastHoverState) playTone(700, 0.08, 'sine', 0.08, 900);
  lastHoverState = isHovering;

  if (isHovering) {
    const bubbleX = nikitaX + 90;
    const bubbleY = nikitaY - 170;
    const bubbleW = 190;
    const bubbleH = 75;

    ctx.save();
    // Тень
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    roundRect(ctx, bubbleX + 6, bubbleY + 6, bubbleW, bubbleH, 22); ctx.fill();

    // Фон облака с градиентом
    const bubbleGrad = ctx.createLinearGradient(bubbleX, bubbleY, bubbleX, bubbleY + bubbleH);
    bubbleGrad.addColorStop(0, '#ffffff'); bubbleGrad.addColorStop(1, '#e8d8ff');
    ctx.fillStyle = bubbleGrad;
    roundRect(ctx, bubbleX, bubbleY, bubbleW, bubbleH, 22); ctx.fill();
    
    // Обводка с градиентом
    const borderGrad = ctx.createLinearGradient(bubbleX, bubbleY, bubbleX + bubbleW, bubbleY + bubbleH);
    borderGrad.addColorStop(0, '#d0a8ff'); borderGrad.addColorStop(1, '#b86bff');
    ctx.strokeStyle = borderGrad;
    ctx.lineWidth = 3;
    roundRect(ctx, bubbleX, bubbleY, bubbleW, bubbleH, 22); ctx.stroke();

    // Хвостик
    ctx.fillStyle = '#e8d8ff';
    ctx.beginPath();
    ctx.moveTo(bubbleX + 10, bubbleY + bubbleH - 18);
    ctx.lineTo(bubbleX - 22, bubbleY + bubbleH + 12);
    ctx.lineTo(bubbleX + 25, bubbleY + bubbleH - 15);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b86bff';
    ctx.beginPath();
    ctx.moveTo(bubbleX + 10, bubbleY + bubbleH - 18);
    ctx.lineTo(bubbleX - 22, bubbleY + bubbleH + 12);
    ctx.lineTo(bubbleX + 25, bubbleY + bubbleH - 15);
    ctx.stroke();

    // Текст
    ctx.fillStyle = '#2d1b4e';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Осуждаю!', bubbleX + bubbleW/2, bubbleY + bubbleH/2 + 11);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  // Кнопка
  const btn = startButton;
  const btnHover = mouse.x >= btn.x && mouse.x <= btn.x + btn.w &&
                   mouse.y >= btn.y && mouse.y <= btn.y + btn.h;
  if (btnHover && !btn.hover) sfx.buttonHover();
  btn.hover = btnHover;

  const btnPulse = Math.sin(time * 0.005) * 0.04 + 1;
  ctx.save();
  ctx.translate(btn.x + btn.w/2, btn.y + btn.h/2);
  ctx.scale(btnPulse, btnPulse);
  ctx.translate(-(btn.x + btn.w/2), -(btn.y + btn.h/2));

  if (btnHover) {
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 40;
  } else {
    ctx.shadowColor = 'rgba(180, 100, 255, 0.7)';
    ctx.shadowBlur = 25;
  }

  const btnGrad = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
  if (btnHover) {
    btnGrad.addColorStop(0, '#fff8b0'); btnGrad.addColorStop(0.5, '#ffd700'); btnGrad.addColorStop(1, '#ff8c00');
  } else {
    btnGrad.addColorStop(0, '#a86bff'); btnGrad.addColorStop(0.5, '#8b3fc7'); btnGrad.addColorStop(1, '#5a1a8a');
  }
  ctx.fillStyle = btnGrad;
  roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 14); ctx.fill();

  // Блик сверху
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  roundRect(ctx, btn.x + 4, btn.y + 4, btn.w - 8, btn.h/2 - 4, 10); ctx.fill();

  // Обводка
  ctx.strokeStyle = btnHover ? '#fff' : 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 14); ctx.stroke();

  // Текст
  ctx.fillStyle = btnHover ? '#1a0a2e' : '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Биться за смены', btn.x + btn.w/2, btn.y + btn.h/2);

  ctx.restore();
  ctx.textBaseline = 'alphabetic';
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';

  // Подсказка
  ctx.fillStyle = 'rgba(200, 180, 255, 0.5)';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Наведи на Никиту', W/2, H - 20);
  ctx.textAlign = 'left';

  // Клик
  if (mouse.isDown && btnHover) {
    mouse.isDown = false;
    startGame();
  }
}

// ==================== ГЛАВНЫЙ ЦИКЛ ====================
function draw() {
  globalTime = Date.now();
  if (gameState === 'menu') {
    drawMenu(globalTime);
  } else {
    drawGame();
  }
}

function loop() {
  globalTime = Date.now();
  if (gameState !== 'menu') update();
  else {
    // В меню — только визуальные эффекты
    menuTime += 16;
  }
  draw();
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  if (e.code === 'KeyM') soundEnabled = !soundEnabled;
});

loop();
